
spring.application.name=fraud-ring-detector

# Persistent H2 database stored in the project directory
spring.datasource.url=jdbc:h2:file:./data/fraudringdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically create or update database tables
spring.jpa.hibernate.ddl-auto=update

# Display SQL queries in the terminal
spring.jpa.show-sql=true

# Keep Spring Security diagnostic logging enabled
logging.level.org.springframework.security=DEBUG
